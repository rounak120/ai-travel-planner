spring:
  ai:
    mcp:
      server:
        enabled: true
        protocol: STREAMABLE
        type: SYNC
        name: travel-planner-tools
        version: 0.1.0
        instructions: Read-only destination and trip-weather tools. No bookings or trip changes. Weather requires an existing trip with a selected location and eligible dates.
        tool-callback-converter: false
        annotation-scanner:
          enabled: true
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        streamable-http:
          mcp-endpoint: /mcp
