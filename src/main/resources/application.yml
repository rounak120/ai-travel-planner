spring:
  application:
    name: ai-travel-planner
  config:
    # Explicitly load local credentials; environment variables can override them.
    import: optional:file:./.env[.properties]
  ai:
    # No model is created unless we explicitly activate the ai profile.
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/ai_travel_planner}
    username: ${DB_USERNAME:travel_planner}
    password: ${DB_PASSWORD}
  jpa:
    # Flyway owns schema changes. Hibernate checks that entity mappings match the tables.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

travel:
  geocoding:
    base-url: https://geocoding-api.open-meteo.com
    timeout-ms: 5000

server:
  # Bind to this computer while we build the unauthenticated learning starter.
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
