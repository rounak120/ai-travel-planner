<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Account · Wayfarer</title><link rel="stylesheet" href="/chat.css"><script src="/app.js" defer></script><script src="/account.js" defer></script></head>
<body><main><header></header><section class="intro"><h1>Your travel account.</h1><p>Sign in to access only your trips. Existing unassigned trips remain private and hidden.</p></section>
<section class="workspace"><p id="account-status" role="status" aria-live="polite"></p><form id="account-form"><label for="username">Username (3–50 lowercase letters, numbers or underscores)</label><input id="username" required pattern="[a-z0-9_]{3,50}" maxlength="50" autocomplete="username"><label for="password">Password (12–72 characters; at most 72 UTF-8 bytes)</label><input id="password" type="password" required minlength="12" maxlength="72" autocomplete="current-password"><div class="actions"><button class="primary" type="submit">Sign in</button><button class="secondary" id="register" type="button">Create account</button></div></form><button class="secondary" id="logout" type="button" hidden>Sign out and clear chat memory</button><p class="hint">Local learning app. No password recovery or email verification yet. Do not reuse a password from another service.</p><a href="/dashboard.html">Back to My Trips</a></section></main></body></html>
