<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Edit trip · Wayfarer</title><link rel="stylesheet" href="/chat.css"><script src="/app.js" defer></script><script src="/edit.js" defer></script></head><body><main><header></header><section class="intro"><h1>Refine your trip.</h1><p>Changing the destination clears its selected location. Existing itineraries stay unchanged as historical snapshots; generate or revise a plan after editing.</p></section><section class="workspace"><button id="edit-load" class="secondary">Load trip to edit</button><p id="edit-status" role="status" aria-live="polite"></p><form id="edit-form" hidden><label for="destination">Destination</label><input id="destination" required maxlength="200"><label for="startDate">Start date</label><input id="startDate" type="date" required><label for="endDate">End date</label><input id="endDate" type="date" required><label for="travelers">Travelers</label><input id="travelers" type="number" min="1" max="100" required><label for="budget">Budget</label><input id="budget" type="number" min="0.01" step="0.01" required><label for="currency">Currency</label><input id="currency" pattern="[A-Z]{3}" maxlength="3" required><label for="interests">Interests (one per line, up to 20)</label><textarea id="interests" rows="4"></textarea><button class="primary" type="submit">Save changes</button></form><a href="/dashboard.html">Back to My Trips</a></section></main></body></html>
